function getNodeW(node) {
    if (node.width) return node.width;
    const pt = state.processTypes[node.processType] || Object.values(state.processTypes)[0];
    if (pt && pt.shape === 'circle') return circleDefaultSize;
    return state.nodeWidth;
}

function getNodeH(node) {
    if (node.height) return node.height;
    const pt = state.processTypes[node.processType] || Object.values(state.processTypes)[0];
    if (pt && pt.shape === 'circle') return getNodeW(node);
    return state.nodeHeight;
}

// Utility functions
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function throttle(func, delay) {
    let lastCall = 0;
    return function(...args) {
        const now = Date.now();
        if (now - lastCall >= delay) {
            lastCall = now;
            return func.apply(this, args);
        }
    };
}

function safeLoadFromStorage(key, defaultValue) {
    try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : defaultValue;
    } catch (e) {
        console.warn(`Failed to load ${key} from storage:`, e);
        return defaultValue;
    }
}

function safeSaveToStorage(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
    } catch (e) {
        console.error(`Failed to save ${key} to storage:`, e);
        return false;
    }
}

// Node map and adjacency rebuilding
function rebuildMaps() {
    state.nodeMap = new Map(state.nodes.map(n => [n.id, n]));
    state.adjacency = new Map();
    state.nodes.forEach(n => state.adjacency.set(n.id, new Set()));
    state.links.forEach(l => {
        if (state.adjacency.has(l.source) && state.adjacency.has(l.target)) {
            state.adjacency.get(l.source).add(l.target);
            state.adjacency.get(l.target).add(l.source);
        }
    });
}

// Smart text splitting for multi-line node labels
function splitTextSmart(text, maxLines = 3) {
    const words = text.split(' ');
    if (words.length === 1) return [text];
    if (words.length === 2) return words;
    const totalLength = text.length;
    const targetLineLength = totalLength / Math.min(words.length, maxLines);
    const lines = [];
    let currentLine = '';
    for (const word of words) {
        if (lines.length >= maxLines - 1) {
            currentLine = currentLine ? currentLine + ' ' + word : word;
        } else if (!currentLine) {
            currentLine = word;
        } else if ((currentLine + ' ' + word).length <= targetLineLength + 4) {
            currentLine += ' ' + word;
        } else {
            lines.push(currentLine);
            currentLine = word;
        }
    }
    if (currentLine) lines.push(currentLine);
    return lines;
}

function calculateOptimalAnchors(sourceNode, targetNode, link) {
    const srcAnchorOverride = link && link.sourceAnchor ? link.sourceAnchor : null;
    const tgtAnchorOverride = link && link.targetAnchor ? link.targetAnchor : null;

    if (srcAnchorOverride && tgtAnchorOverride) {
        return { source: srcAnchorOverride, target: tgtAnchorOverride };
    }

    const cacheKey = `${sourceNode.id}-${targetNode.id}-${sourceNode.x}-${sourceNode.y}-${targetNode.x}-${targetNode.y}-${srcAnchorOverride || 'auto'}-${tgtAnchorOverride || 'auto'}`;
    if (state.anchorCache.has(cacheKey)) {
        return state.anchorCache.get(cacheKey);
    }

    const sides = ['top', 'bottom', 'left', 'right'];
    const sourceSides = srcAnchorOverride ? [srcAnchorOverride] : sides;
    const targetSides = tgtAnchorOverride ? [tgtAnchorOverride] : sides;
    let minDistance = Infinity;
    let bestAnchors = { source: srcAnchorOverride || 'right', target: tgtAnchorOverride || 'left' };

    for (const sourceSide of sourceSides) {
        for (const targetSide of targetSides) {
            const sourcePoint = getAnchorPoint(sourceNode, sourceSide);
            const targetPoint = getAnchorPoint(targetNode, targetSide);
            const distance = Math.hypot(targetPoint.x - sourcePoint.x, targetPoint.y - sourcePoint.y);
            if (distance < minDistance) {
                minDistance = distance;
                bestAnchors = { source: sourceSide, target: targetSide };
            }
        }
    }

    state.anchorCache.set(cacheKey, bestAnchors);
    return bestAnchors;
}

function getAnchorPoint(node, anchor) {
    const w = getNodeW(node);
    const h = getNodeH(node);
    const centerX = node.x;
    const centerY = node.y + h / 2;
    const pt = state.processTypes[node.processType] || Object.values(state.processTypes)[0];

    if (pt.shape === 'circle') {
        const r = h;
        switch(anchor) {
            case 'top':    return { x: centerX, y: centerY - r };
            case 'bottom': return { x: centerX, y: centerY + r };
            case 'left':   return { x: centerX - r, y: centerY };
            case 'right':  return { x: centerX + r, y: centerY };
            default:       return { x: centerX + r, y: centerY };
        }
    }

    if (pt.shape === 'triangle') {
        const topY = node.y;
        const bottomY = node.y + h;
        switch(anchor) {
            case 'top':    return { x: centerX, y: topY };
            case 'bottom': return { x: centerX, y: bottomY };
            case 'left':   return { x: centerX - w/4, y: centerY };
            case 'right':  return { x: centerX + w/4, y: centerY };
            default:       return { x: centerX + w/4, y: centerY };
        }
    }

    switch(anchor) {
        case 'top':    return { x: centerX, y: node.y };
        case 'bottom': return { x: centerX, y: node.y + h };
        case 'left':   return { x: centerX - w/2, y: centerY };
        case 'right':  return { x: centerX + w/2, y: centerY };
        default:       return { x: centerX + w/2, y: centerY };
    }
}

function getControlPoints(sourcePoint, targetPoint, sourceAnchor, targetAnchor) {
    const dx = targetPoint.x - sourcePoint.x;
    const dy = targetPoint.y - sourcePoint.y;
    let cp1x, cp1y, cp2x, cp2y;
    const baseOffset = Math.min(Math.abs(dx) * CONFIG.BEZIER_OFFSET.factor, Math.abs(dy) * CONFIG.BEZIER_OFFSET.factor, CONFIG.BEZIER_OFFSET.max);
    const offset = Math.max(baseOffset, CONFIG.BEZIER_OFFSET.min);

    switch(sourceAnchor) {
        case 'top': cp1x = sourcePoint.x; cp1y = sourcePoint.y - offset; break;
        case 'bottom': cp1x = sourcePoint.x; cp1y = sourcePoint.y + offset; break;
        case 'left': cp1x = sourcePoint.x - offset; cp1y = sourcePoint.y; break;
        default: cp1x = sourcePoint.x + offset; cp1y = sourcePoint.y; break;
    }

    switch(targetAnchor) {
        case 'top': cp2x = targetPoint.x; cp2y = targetPoint.y - offset; break;
        case 'bottom': cp2x = targetPoint.x; cp2y = targetPoint.y + offset; break;
        case 'left': cp2x = targetPoint.x - offset; cp2y = targetPoint.y; break;
        default: cp2x = targetPoint.x + offset; cp2y = targetPoint.y; break;
    }

    return { cp1x, cp1y, cp2x, cp2y };
}

function createBezierPath(d) {
    const source = state.nodeMap.get(d.source);
    const target = state.nodeMap.get(d.target);
    if (!source || !target) return '';

    const { source: sourceAnchor, target: targetAnchor } = calculateOptimalAnchors(source, target, d);
    const sourcePoint = getAnchorPoint(source, sourceAnchor);
    const targetPoint = getAnchorPoint(target, targetAnchor);

    const waypoints = d.waypoints || [];
    if (waypoints.length > 0) {
        const points = [sourcePoint, ...waypoints, targetPoint];
        return d3.line()
            .x(p => p.x)
            .y(p => p.y)
            .curve(d3.curveCatmullRom.alpha(0.5))(points);
    }

    const { cp1x, cp1y, cp2x, cp2y } = getControlPoints(sourcePoint, targetPoint, sourceAnchor, targetAnchor);
    return `M ${sourcePoint.x},${sourcePoint.y} C ${cp1x},${cp1y} ${cp2x},${cp2y} ${targetPoint.x},${targetPoint.y}`;
}

function setLinkWidthCSSProps(w) {

function getLinkDisplayColor() {
    if (!state.isLightMode) {
        // Lighten the user's chosen color for dark backgrounds
        const r = parseInt(linkColor.slice(1,3), 16);
        const g = parseInt(linkColor.slice(3,5), 16);
        const b = parseInt(linkColor.slice(5,7), 16);
        const lighten = (c) => Math.round(c + (255 - c) * 0.4);
        return `rgb(${lighten(r)}, ${lighten(g)}, ${lighten(b)})`;
    }
    return state.linkColor;
}

function createLegendShapeSVG(shape, dashed) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 12 12');
    svg.style.width = '20px';
    svg.style.height = '20px';
    svg.style.flexShrink = '0';

    let el;
    switch (shape) {
        case 'rect':
            el = document.createElementNS(svgNS, 'rect');
            el.setAttribute('x', '1.5');
            el.setAttribute('y', '1.5');
            el.setAttribute('width', '9');
            el.setAttribute('height', '9');
            el.setAttribute('rx', '2');
            break;
        case 'circle':
            el = document.createElementNS(svgNS, 'circle');
            el.setAttribute('cx', '6');
            el.setAttribute('cy', '6');
            el.setAttribute('r', '4.5');
            break;
        case 'triangle':
            el = document.createElementNS(svgNS, 'polygon');
            el.setAttribute('points', '1.5,1.5 10.5,1.5 6,10.5');
            break;
        case 'hexagon':
            el = document.createElementNS(svgNS, 'polygon');
            el.setAttribute('points', '3,1.5 9,1.5 11.5,6 9,10.5 3,10.5 0.5,6');
            break;
        case 'diamond':
            el = document.createElementNS(svgNS, 'polygon');
            el.setAttribute('points', '6,1.5 10.5,6 6,10.5 1.5,6');
            break;
        default:
            el = document.createElementNS(svgNS, 'rect');
            el.setAttribute('x', '1.5');
            el.setAttribute('y', '1.5');
            el.setAttribute('width', '9');
            el.setAttribute('height', '9');
            el.setAttribute('rx', '2');
    }

    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', '#94a3b8');
    el.setAttribute('stroke-width', '0.8');
    if (dashed) {
        el.setAttribute('stroke-dasharray', '2,1.5');
    }

    svg.appendChild(el);
    return svg;
}

function rebuildLegend() {
    const legend = document.getElementById('legend');
    const wasCollapsed = legend.classList.contains('collapsed');
    legend.innerHTML = '';

    // Collapse toggle button
    const toggle = document.createElement('div');
    toggle.id = 'legend-toggle';
    toggle.textContent = wasCollapsed ? '\u25B8' : '\u25BE';
    toggle.addEventListener('click', function() {
        const isCollapsed = legend.classList.toggle('collapsed');
        toggle.textContent = isCollapsed ? '\u25B8' : '\u25BE';
    });
    legend.appendChild(toggle);

    if (wasCollapsed) {
        legend.classList.add('collapsed');
    }

    // Role header
    const roleH3 = document.createElement('h3');
    roleH3.textContent = state.roleCategoryLabel;
    legend.appendChild(roleH3);

    // Role items
    Object.keys(state.roleColors).forEach(role => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.setAttribute('data-role', role);

        const colorDiv = document.createElement('div');
        colorDiv.className = 'legend-color';
        colorDiv.style.background = state.roleColors[role];
        item.appendChild(colorDiv);

        item.appendChild(document.createTextNode(role));

        item.addEventListener('click', function() {
            toggleRoleFilter(role);
        });

        legend.appendChild(item);
    });

    // Process type header
    const ptH3 = document.createElement('h3');
    ptH3.style.marginTop = '10px';
    ptH3.textContent = state.processTypeCategoryLabel;
    legend.appendChild(ptH3);

    // Process type items
    Object.keys(state.processTypes).forEach(key => {
        const pt = state.processTypes[key];
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.setAttribute('data-process-type', key);

        item.appendChild(createLegendShapeSVG(pt.shape, pt.dashed));
        item.appendChild(document.createTextNode(pt.label));

        item.addEventListener('click', function() {
            toggleProcessTypeFilter(key);
        });

        legend.appendChild(item);
    });

    // Additional Resources filter (only if any node has resources)
    const hasResources = state.nodes.some(n => n.resources && n.resources.length > 0);
    if (hasResources) {
        const resH3 = document.createElement('h3');
        resH3.style.marginTop = '10px';
        resH3.textContent = 'Resources';
        legend.appendChild(resH3);

        const resItem = document.createElement('div');
        resItem.className = 'legend-item';
        resItem.setAttribute('data-resource-filter', 'true');

        const resColor = document.createElement('div');
        resColor.className = 'legend-color';
        resColor.style.background = '#1e3a5f';
        resItem.appendChild(resColor);

        resItem.appendChild(document.createTextNode('Additional Resources'));

        resItem.addEventListener('click', function() {
            toggleResourceFilter();
        });

        legend.appendChild(resItem);
    }

    // Clear filter button
    const clearDiv = document.createElement('div');
    clearDiv.className = 'legend-clear';
    clearDiv.textContent = 'Clear Filter';
    clearDiv.addEventListener('click', clearRoleFilter);
    legend.appendChild(clearDiv);
}

function toggleRoleFilter(role) {
    // Clear any process type / resource / search filter first
    state.selectedProcessType = null;
    state.selectedResourceFilter = false;
    state.searchQuery = '';
    const searchInput = document.getElementById('search-input');
    if (searchInput) { searchInput.value = ''; }
    const searchClear = document.getElementById('search-clear');
    if (searchClear) { searchClear.style.display = 'none'; }

    if (state.selectedRole === role) {
        state.selectedRole = null;
        clearLegendHighlights();
    } else {
        state.selectedRole = role;
        document.querySelectorAll('.legend-item').forEach(item => {
            const itemRole = item.getAttribute('data-role');
            if (itemRole === role) {
                item.classList.add('active');
                item.classList.remove('dimmed');
            } else {
                item.classList.remove('active');
                item.classList.add('dimmed');
            }
        });

        window.nodeElements.classed('role-filtered', d => d.role !== role);
        window.linkElements.attr('opacity', d => {
            const sourceNode = state.nodeMap.get(d.source);
            const targetNode = state.nodeMap.get(d.target);
            return (sourceNode && sourceNode.role === role) || (targetNode && targetNode.role === role) ? 0.8 : 0.1;
        });
        rebuildMaps();
    }
}

function applySearchFilter(query) {
    state.searchQuery = query;
    const searchClear = document.getElementById('search-clear');
    if (searchClear) searchClear.style.display = query ? 'block' : 'none';

    if (!query) {
        // Clear search filtering
        window.nodeElements.classed('role-filtered', false);
        window.linkElements.attr('opacity', state.linkOpacity);
        return;
    }

    // Clear legend filters (mutual exclusivity)
    state.selectedRole = null;
    state.selectedProcessType = null;
    state.selectedResourceFilter = false;
    document.querySelectorAll('.legend-item').forEach(item => {
        item.classList.remove('active', 'dimmed');
    });

    const lowerQuery = query.toLowerCase();

    // Find matching node IDs
    const matchingIds = new Set();
    state.nodes.forEach(node => {
        const nameMatch = node.name && node.name.toLowerCase().includes(lowerQuery);
        const descMatch = node.desc && node.desc.toLowerCase().includes(lowerQuery);
        let resourceMatch = false;
        if (node.resources) {
            resourceMatch = node.resources.some(r =>
                (r.text && r.text.toLowerCase().includes(lowerQuery)) ||
                (r.url && r.url.toLowerCase().includes(lowerQuery))
            );
        }
        if (nameMatch || descMatch || resourceMatch) {
            matchingIds.add(node.id);
        }
    });

    // Apply filtering
    window.nodeElements.classed('role-filtered', d => !matchingIds.has(d.id));
    window.linkElements.attr('opacity', d => {
        return matchingIds.has(d.source) || matchingIds.has(d.target) ? 0.8 : 0.1;
    });
}

function setupSearch() {
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    if (!searchInput) return;

    searchInput.addEventListener('input', function() {
        applySearchFilter(this.value.trim());
    });

    searchClear.addEventListener('click', function() {
        searchInput.value = '';
        applySearchFilter('');
        searchInput.focus();
    });

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            searchInput.value = '';
            applySearchFilter('');
            searchInput.blur();
        }
    });
}

function showSidePanel(nodeData) {
    const panel = document.getElementById('sidepanel');
    const content = document.getElementById('panel-content');

    const connected = state.adjacency.get(nodeData.id) || new Set();
    const connectedNodes = Array.from(connected).map(id => state.nodeMap.get(id)).filter(Boolean);

    const resources = nodeData.resources || [];

    // Clear existing content
    content.innerHTML = '';

    // Create header with node name (safe from XSS)
    const h2 = document.createElement('h2');
    h2.textContent = nodeData.name;
    content.appendChild(h2);

    // Create role badge
    const roleBadge = document.createElement('span');
    roleBadge.className = 'role-badge';
    roleBadge.style.background = state.roleColors[nodeData.role];
    roleBadge.textContent = nodeData.role;
    content.appendChild(roleBadge);

    // Create description
    const description = document.createElement('p');
    description.className = 'description';
    description.textContent = nodeData.desc;
    content.appendChild(description);

    // Create connected activities section
    const connectedSection = document.createElement('div');
    connectedSection.className = 'section';
    const connectedH3 = document.createElement('h3');
    connectedH3.textContent = `Connected Activities (${connectedNodes.length})`;
    connectedSection.appendChild(connectedH3);

    connectedNodes.forEach(node => {
        const item = document.createElement('div');
        item.className = 'connection-item';
        item.onclick = () => highlightNode(node.id);

        const dot = document.createElement('div');
        dot.className = 'connection-dot';
        dot.style.background = state.roleColors[node.role];
        item.appendChild(dot);

        const span = document.createElement('span');
        span.textContent = node.name;
        item.appendChild(span);

        connectedSection.appendChild(item);
    });
    content.appendChild(connectedSection);

    // Create process type section
    const processSection = document.createElement('div');
    processSection.className = 'section';
    const processH3 = document.createElement('h3');
    processH3.textContent = 'Process Type';
    processSection.appendChild(processH3);
    const processP = document.createElement('p');
    processP.textContent = (state.processTypes[nodeData.processType] || Object.values(state.processTypes)[0]).label;
    processSection.appendChild(processP);
    content.appendChild(processSection);

    // Create resources section if resources exist
    if (resources.length > 0) {
        const resourcesSection = document.createElement('div');
        resourcesSection.className = 'section';
        const resourcesH3 = document.createElement('h3');
        resourcesH3.textContent = 'Additional Resources';
        resourcesSection.appendChild(resourcesH3);

        resources.forEach(r => {
            if (typeof r === 'object' && r.text) {
                if (r.url) {
                    const href = r.url.match(/^https?:\/\/|^file:\/\//) ? r.url : 'https://' + r.url;
                    const link = document.createElement('a');
                    link.href = href;
                    link.className = 'resource-link';
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.textContent = '\u2022 ' + r.text;
                    resourcesSection.appendChild(link);
                } else {
                    const span = document.createElement('span');
                    span.className = 'resource-link';
                    span.textContent = '\u2022 ' + r.text;
                    resourcesSection.appendChild(span);
                }
            } else {
                const label = typeof r === 'string' ? r : (r.text || r.url || '');
                const span = document.createElement('span');
                span.className = 'resource-link';
                span.textContent = '\u2022 ' + label;
                resourcesSection.appendChild(span);
            }
        });

        content.appendChild(resourcesSection);
    }

    panel.classList.add('open');
    document.getElementById('canvas').classList.add('panel-open');
}

    document.getElementById('sidepanel').classList.remove('open');
    document.getElementById('canvas').classList.remove('panel-open');

// Click/double-click on background
svg.on('click', (event) => {
    if (isCanvasBackground(event.target)) {
        closeAnnotationContextMenu();
        if (state.editingLink) {
            closeLinkEditor();
            return;
        }
        // Clear multi-select on background click (drag/select mode), unless shift held or just finished rubber-band
        if ((state.currentDrawTool === 'drag' || state.currentDrawTool === 'select') && !event.shiftKey && !state._justFinishedRubberBand) {
            clearMultiSelect();
        }
        if (state.currentDrawTool !== 'none' && state.currentDrawTool !== 'select' && state.currentDrawTool !== 'drag') return;
        if (state.linkSourceNode) {
            cancelLinkCreation();
        }
        if (state.currentDrawTool === 'select' && !event.target.closest('.annotation')) {
            deselectAnnotation();
        }
        clearSelection();
        closeSidePanel();
    }
});

svg.on('dblclick', (event) => {
    if (!state.isEditMode) return;
    if (state.currentDrawTool !== 'none') return; // suppress node creation in draw mode
    if (!isCanvasBackground(event.target)) return;
    event.preventDefault();

    // Get coordinates in SVG space
    const transform = d3.zoomTransform(svg.node());
    const pt = svg.node().createSVGPoint();
    pt.x = event.clientX;
    pt.y = event.clientY;
    const svgP = pt.matrixTransform(svg.node().getScreenCTM().inverse());
    const x = (svgP.x - transform.x) / transform.k;
    const y = (svgP.y - transform.y) / transform.k;

    // Create new node centered on click position
    const defaultPt = state.processTypes[Object.keys(state.processTypes)[0]] || { shape: 'rect' };
    const defaultH = (defaultPt.shape === 'circle') ? circleDefaultSize : state.nodeHeight;
    createNewNode(x, y - defaultH / 2);
});

// Helper: get SVG coordinates from mouse event
// Mouse move for temp link line + drawing + rubber-band
svg.on('mousemove', (event) => {
    // Rubber-band resize
    if (state.isRubberBanding && state.rubberBandStart) {
        const { x, y } = getSVGCoords(event);
        const rbRect = g.select('.rubberband-layer rect');
        if (rbRect.node()) {
            rbRect
                .attr('x', Math.min(state.rubberBandStart.x, x))
                .attr('y', Math.min(state.rubberBandStart.y, y))
                .attr('width', Math.abs(x - state.rubberBandStart.x))
                .attr('height', Math.abs(y - state.rubberBandStart.y));
        }
        return;
    }

    // Temp link line
    if (state.linkSourceNode) {
        const { x, y } = getSVGCoords(event);
        const sourceNode = state.nodeMap.get(state.linkSourceNode);
        tempLinkLine
            .attr('x1', sourceNode.x)
            .attr('y1', sourceNode.y + getNodeH(sourceNode) / 2)
            .attr('x2', x)
            .attr('y2', y);
    }

    // Drawing preview
    if (state.drawingAnnotation) {
        const { x, y } = getSVGCoords(event);
        handleDrawMouseMove(x, y);
    }
});

// Mousedown for drawing state.annotations + rubber-band selection
svg.on('mousedown', (event) => {
    if (!state.isEditMode) return;
    if (event.button !== 0) return;

    // Rubber-band selection: Shift+drag on background in drag or select mode
    if (event.shiftKey && (state.currentDrawTool === 'drag' || state.currentDrawTool === 'select') && isCanvasBackground(event.target)) {
        event.preventDefault();
        event.stopPropagation();
        const { x, y } = getSVGCoords(event);
        state.rubberBandStart = { x, y };
        state.isRubberBanding = true;
        const rbLayer = g.select('.rubberband-layer');
        rbLayer.selectAll('*').remove();
        rbLayer.append('rect')
            .attr('class', 'rubberband-rect')
            .attr('x', x).attr('y', y)
            .attr('width', 0).attr('height', 0);
        return;
    }

    if (state.currentDrawTool === 'none' || state.currentDrawTool === 'select' || state.currentDrawTool === 'drag') return;
    if (!isCanvasBackground(event.target)) return;

    const { x, y } = getSVGCoords(event);
    handleDrawMouseDown(x, y, event);
});

// Mouseup for drawing state.annotations + rubber-band completion
svg.on('mouseup', (event) => {
    if (state.isRubberBanding) {
        finishRubberBand(event);
        return;
    }
    if (state.drawingAnnotation) {
        const { x, y } = getSVGCoords(event);
        handleDrawMouseUp(x, y);
    }
});

function initVisualization() {
    // Clear existing
    g.selectAll('.annotation-layer').remove();
    g.selectAll('.link').remove();
    g.selectAll('.node').remove();
    g.selectAll('.rubberband-layer').remove();

    // Annotation layer goes behind state.links and state.nodes
    g.append('g').attr('class', 'annotation-layer');

    drawAnnotations();
    drawLinks();
    drawNodes();

    // Rubberband layer on top of everything
    g.append('g').attr('class', 'rubberband-layer');
}

function finishRubberBand(event) {
    if (!state.isRubberBanding) return;
    const { x, y } = getSVGCoords(event);
    const x1 = Math.min(state.rubberBandStart.x, x);
    const y1 = Math.min(state.rubberBandStart.y, y);
    const x2 = Math.max(state.rubberBandStart.x, x);
    const y2 = Math.max(state.rubberBandStart.y, y);
    const bbox = { x1, y1, x2, y2 };

    // Only select if marquee has some size (avoid accidental clicks)
    if (x2 - x1 > 5 || y2 - y1 > 5) {
        // If not holding shift from a previous selection, clear first
        if (!event.shiftKey) clearMultiSelect();

        // Test state.nodes
        state.nodes.forEach(n => {
            if (intersectsNode(n, bbox)) {
                state.multiSelected.add('node:' + n.id);
            }
        });

        // Test state.annotations
        state.annotations.forEach(a => {
            if (intersectsAnnotation(a, bbox)) {
                state.multiSelected.add('ann:' + a.id);
            }
        });

        drawMultiSelectOutlines();
    }

    // Clean up
    g.select('.rubberband-layer').select('.rubberband-rect').remove();
    state.rubberBandStart = null;
    state.isRubberBanding = false;

    // Prevent the subsequent click event from clearing the selection
    state._justFinishedRubberBand = true;
    setTimeout(() => { state._justFinishedRubberBand = false; }, 50);
}

function intersectsNode(node, bbox) {
    const w = getNodeW(node);
    const h = getNodeH(node);
    const nx1 = node.x - w / 2;
    const ny1 = node.y;
    const nx2 = node.x + w / 2;
    const ny2 = node.y + h;
    return nx1 < bbox.x2 && nx2 > bbox.x1 && ny1 < bbox.y2 && ny2 > bbox.y1;
}

function intersectsAnnotation(ann, bbox) {
    if (ann.type === 'line') {
        const ax1 = Math.min(ann.x, ann.x2);
        const ay1 = Math.min(ann.y, ann.y2);
        const ax2 = Math.max(ann.x, ann.x2);
        const ay2 = Math.max(ann.y, ann.y2);
        return ax1 < bbox.x2 && ax2 > bbox.x1 && ay1 < bbox.y2 && ay2 > bbox.y1;
    } else if (ann.type === 'circle') {
        const cx = ann.x;
        const cy = ann.y;
        const r = ann.r || 20;
        return (cx + r) > bbox.x1 && (cx - r) < bbox.x2 && (cy + r) > bbox.y1 && (cy - r) < bbox.y2;
    } else if (ann.type === 'text') {
        const tw = ann.fontSize ? ann.fontSize * (ann.text || '').length * 0.6 : 60;
        const th = ann.fontSize || 16;
        return ann.x < bbox.x2 && (ann.x + tw) > bbox.x1 && (ann.y - th) < bbox.y2 && ann.y > bbox.y1;
    } else {
        // rect
        const aw = ann.w || 100;
        const ah = ann.h || 60;
        return ann.x < bbox.x2 && (ann.x + aw) > bbox.x1 && ann.y < bbox.y2 && (ann.y + ah) > bbox.y1;
    }
}

function clearMultiSelect() {
    state.multiSelected.clear();
    drawMultiSelectOutlines();
}

function drawMultiSelectOutlines() {
    // Remove old outlines
    g.selectAll('.multi-select-outline').remove();
    if (state.multiSelected.size === 0) return;

    const outlineLayer = g.select('.rubberband-layer');

    // Draw outlines for selected state.nodes
    getMultiSelectedNodes().forEach(id => {
        const node = state.nodeMap.get(id);
        if (!node) return;
        const w = getNodeW(node);
        const h = getNodeH(node);
        outlineLayer.append('rect')
            .attr('class', 'multi-select-outline')
            .attr('x', node.x - w / 2 - 4)
            .attr('y', node.y - 4)
            .attr('width', w + 8)
            .attr('height', h + 8)
            .attr('rx', 6);
    });

    // Draw outlines for selected state.annotations
    getMultiSelectedAnnotations().forEach(id => {
        const ann = state.annotations.find(a => a.id === id);
        if (!ann) return;
        if (ann.type === 'line') {
            const lx = Math.min(ann.x, ann.x2) - 4;
            const ly = Math.min(ann.y, ann.y2) - 4;
            const lw = Math.abs(ann.x2 - ann.x) + 8;
            const lh = Math.abs(ann.y2 - ann.y) + 8;
            outlineLayer.append('rect')
                .attr('class', 'multi-select-outline')
                .attr('x', lx).attr('y', ly)
                .attr('width', lw).attr('height', lh);
        } else if (ann.type === 'circle') {
            outlineLayer.append('circle')
                .attr('class', 'multi-select-outline')
                .attr('cx', ann.x).attr('cy', ann.y)
                .attr('r', (ann.r || 20) + 4);
        } else if (ann.type === 'text') {
            const tw = ann.fontSize ? ann.fontSize * (ann.text || '').length * 0.6 : 60;
            const th = ann.fontSize || 16;
            outlineLayer.append('rect')
                .attr('class', 'multi-select-outline')
                .attr('x', ann.x - 4).attr('y', ann.y - th - 4)
                .attr('width', tw + 8).attr('height', th + 8);
        } else {
            // rect
            outlineLayer.append('rect')
                .attr('class', 'multi-select-outline')
                .attr('x', ann.x - 4).attr('y', ann.y - 4)
                .attr('width', (ann.w || 100) + 8).attr('height', (ann.h || 60) + 8)
                .attr('rx', 4);
        }
    });
}

        wpGroup.selectAll('.waypoint-handle')

            .on('contextmenu', function(event, d) {

function handleLinkDblClick(event, d) {
    event.preventDefault();
    event.stopPropagation();
    if (!state.isEditMode) return;

    const { x, y } = getSVGCoords(event);

    if (!d.waypoints) d.waypoints = [];

    // Insert waypoint at the position closest to click along the path
    // For simplicity, find the best insertion index by distance to adjacent segments
    if (d.waypoints.length === 0) {
        d.waypoints.push({ x, y });
    } else {
        const source = state.nodeMap.get(d.source);
        const target = state.nodeMap.get(d.target);
        if (!source || !target) return;

        const { source: srcAnch, target: tgtAnch } = calculateOptimalAnchors(source, target, d);
        const srcPt = getAnchorPoint(source, srcAnch);
        const tgtPt = getAnchorPoint(target, tgtAnch);

        const allPts = [srcPt, ...d.waypoints, tgtPt];
        let bestIdx = d.waypoints.length; // default: append before target
        let bestDist = Infinity;

        for (let i = 0; i < allPts.length - 1; i++) {
            const midX = (allPts[i].x + allPts[i + 1].x) / 2;
            const midY = (allPts[i].y + allPts[i + 1].y) / 2;
            const dist = Math.hypot(x - midX, y - midY);
            if (dist < bestDist) {
                bestDist = dist;
                bestIdx = i; // insert after allPts[i], which is waypoints index i - 1 + 1 = i (since allPts[0] is source)
            }
        }
        // bestIdx in allPts corresponds to waypoints index bestIdx (since allPts[0] is source, waypoints starts at index 1)
        // Insert into waypoints at position bestIdx (clamped)
        const wpInsertIdx = Math.max(0, Math.min(bestIdx, d.waypoints.length));
        d.waypoints.splice(wpInsertIdx, 0, { x, y });
    }

    state.selectedLink = d;
    state.editingLink = d;
    clearAnchorCache();
    drawLinks();
    // Update clear waypoints button visibility if editor is open
    const clearBtn = document.getElementById('clear-waypoints-btn');
    if (clearBtn) clearBtn.style.display = d.waypoints.length > 0 ? 'block' : 'none';
}

function waypointDragBehavior() {
    return d3.drag()
        .on('start', function(event) {
            d3.select(this).attr('r', 7);
            event.sourceEvent.stopPropagation();
        })
        .on('drag', function(event, d) {
            d.x = event.x;
            d.y = event.y;
            d.link.waypoints[d.index].x = event.x;
            d.link.waypoints[d.index].y = event.y;
            d3.select(this).attr('cx', event.x).attr('cy', event.y);
            // Update just this link's path
            clearAnchorCache();
            if (window.linkElements) {
                window.linkElements.filter(l => l === d.link).attr('d', createBezierPath);
            }
        })
        .on('end', function(event) {
            d3.select(this).attr('r', 5);
            clearAnchorCache();
        });
}

function appendNodeShape(selection) {
    selection.each(function(d) {
        const group = d3.select(this);
        const pt = state.processTypes[d.processType] || Object.values(state.processTypes)[0];
        const color = state.roleColors[d.role] || '#64748b';
        const fill = color + '33';
        const w = getNodeW(d);
        const h = getNodeH(d);
        let el;

        switch (pt.shape) {
            case 'rect':
                el = group.append('rect')
                    .attr('width', w)
                    .attr('height', h)
                    .attr('rx', 8)
                    .attr('ry', 8);
                break;
            case 'circle': {
                // Radius = h so the circle is visually proportional to rectangles
                const r = h;
                el = group.append('circle')
                    .attr('cx', w / 2)
                    .attr('cy', h / 2)
                    .attr('r', r);
                break;
            }
            case 'triangle':
                el = group.append('polygon')
                    .attr('points', `0,0 ${w},0 ${w/2},${h}`);
                break;
            case 'hexagon': {
                const inset = w * 0.2;
                el = group.append('polygon')
                    .attr('points', `${inset},0 ${w - inset},0 ${w},${h/2} ${w - inset},${h} ${inset},${h} 0,${h/2}`);
                break;
            }
            case 'diamond':
                el = group.append('polygon')
                    .attr('points', `${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}`);
                break;
            default:
                el = group.append('rect')
                    .attr('width', w)
                    .attr('height', h)
                    .attr('rx', 8)
                    .attr('ry', 8);
        }

        el.attr('class', 'node-shape')
            .attr('fill', fill)
            .attr('stroke', color);

        if (pt.dashed) {
            el.attr('stroke-dasharray', CONFIG.DASHED_STROKE);
        }
    });
}

function drawNodes() {
    const nodeElements = g.selectAll('.node')
        .data(state.nodes, d => d.id)
        .join('g')
        .attr('class', 'node')
        .attr('transform', d => `translate(${d.x - getNodeW(d)/2}, ${d.y})`)
        .on('click', handleNodeClick)
        .on('contextmenu', handleNodeRightClick)
        .on('mouseenter', handleNodeHover)
        .on('mouseleave', handleNodeLeave);

    // Drag behavior
    const throttledLinkUpdate = throttle(() => {
        if (window.linkElements) {
            window.linkElements.attr('d', createBezierPath);
        }
    }, CONFIG.THROTTLE_DELAY);

    const drag = d3.drag()
        .on('start', function(event, d) {
            if (state.currentDrawTool === 'drag') {
                d3.select(this).classed('dragging', true);
                d3.select('body').style('cursor', 'grabbing');
                // Group move: store start positions for all selected elements
                if (isMultiSelected('node', d.id) && state.multiSelected.size > 1) {
                    d._groupDrag = true;
                    d._startX = d.x;
                    d._startY = d.y;
                    // Store start positions for all other selected state.nodes
                    getMultiSelectedNodes().forEach(nid => {
                        const n = state.nodeMap.get(nid);
                        if (n && n.id !== d.id) { n._startX = n.x; n._startY = n.y; }
                    });
                    // Store start positions for all selected state.annotations
                    getMultiSelectedAnnotations().forEach(aid => {
                        const a = state.annotations.find(ann => ann.id === aid);
                        if (a) { a._startX = a.x; a._startY = a.y; if (a.type === 'line') { a._startX2 = a.x2; a._startY2 = a.y2; } }
                    });
                    // Store start positions for waypoints on links between selected nodes
                    const selectedNodeIds = getMultiSelectedNodes();
                    state.links.forEach(link => {
                        if (selectedNodeIds.includes(link.source) && selectedNodeIds.includes(link.target) && link.waypoints && link.waypoints.length > 0) {
                            link._waypointStarts = link.waypoints.map(wp => ({ x: wp.x, y: wp.y }));
                        }
                    });
                } else {
                    d._groupDrag = false;
                    // Not in multi-select or not selected — clear selection
                    if (!event.sourceEvent.shiftKey) clearMultiSelect();
                }
            }
        })
        .on('drag', function(event, d) {
            if (state.currentDrawTool === 'drag') {
                if (d._groupDrag) {
                    // Group move: apply delta to all selected elements
                    const dx = event.x - d._startX;
                    const dy = event.y - d._startY;
                    d.x = d._startX + dx;
                    d.y = d._startY + dy;
                    d3.select(this).attr('transform', `translate(${d.x - getNodeW(d)/2}, ${d.y})`);
                    // Move other selected state.nodes
                    getMultiSelectedNodes().forEach(nid => {
                        const n = state.nodeMap.get(nid);
                        if (n && n.id !== d.id && n._startX !== undefined) {
                            n.x = n._startX + dx;
                            n.y = n._startY + dy;
                        }
                    });
                    // Update node transforms
                    g.selectAll('.node').attr('transform', n => `translate(${n.x - getNodeW(n)/2}, ${n.y})`);
                    // Move selected state.annotations
                    getMultiSelectedAnnotations().forEach(aid => {
                        const a = state.annotations.find(ann => ann.id === aid);
                        if (a && a._startX !== undefined) {
                            a.x = a._startX + dx;
                            a.y = a._startY + dy;
                            if (a.type === 'line') { a.x2 = a._startX2 + dx; a.y2 = a._startY2 + dy; }
                        }
                    });
                    // Move waypoints on links between selected nodes
                    state.links.forEach(link => {
                        if (link._waypointStarts) {
                            link.waypoints.forEach((wp, i) => {
                                wp.x = link._waypointStarts[i].x + dx;
                                wp.y = link._waypointStarts[i].y + dy;
                            });
                        }
                    });
                    drawAnnotations();
                    drawMultiSelectOutlines();
                } else {
                    d.x = event.x;
                    d.y = event.y;
                    d3.select(this).attr('transform', `translate(${d.x - getNodeW(d)/2}, ${d.y})`);
                }
                throttledLinkUpdate();
            }
        })
        .on('end', function(event, d) {
            if (state.currentDrawTool === 'drag') {
                d3.select(this).classed('dragging', false);
                d3.select('body').style('cursor', 'grab');
                clearAnchorCache();
                // Clean up temp properties
                if (d._groupDrag) {
                    state.nodes.forEach(n => { delete n._startX; delete n._startY; });
                    state.annotations.forEach(a => { delete a._startX; delete a._startY; delete a._startX2; delete a._startY2; });
                    state.links.forEach(link => { delete link._waypointStarts; });
                    drawAnnotations();
                    drawMultiSelectOutlines();
                }
                delete d._groupDrag;
                // Final update to ensure state.links are accurate
                if (window.linkElements) {
                    window.linkElements.attr('d', createBezierPath);
                }
            }
        });

    nodeElements.call(drag);

    // Remove old shapes/text
    nodeElements.selectAll('.node-shape').remove();
    nodeElements.selectAll('text').remove();

    appendNodeShape(nodeElements);

    const textElements = nodeElements.append('text')
        .attr('x', function(d) { return getNodeW(d) / 2; });

    textElements.each(function(d) {
        const w = getNodeW(d);
        const h = getNodeH(d);
        const lineHeight = 12;
        let lines;
        if (d.name.includes('\n')) {
            lines = d.name.split('\n');
        } else {
            lines = splitTextSmart(d.name);
        }
        const lineCount = lines.length;
        const totalTextHeight = lineCount * lineHeight;
        const startY = (h - totalTextHeight) / 2 + lineHeight * 0.8;

        const el = d3.select(this);
        lines.forEach((line, i) => {
            el.append('tspan')
                .attr('x', w / 2)
                .attr('y', startY + i * lineHeight)
                .text(line);
        });
    });

    window.nodeElements = nodeElements;
}

// ==================== NODE INTERACTION ====================

function handleNodeClick(event, d) {
    if (event) event.stopPropagation();

    // Suppress node interactions in draw tool mode (except 'none', 'select', 'drag')
    if (state.isEditMode && state.currentDrawTool !== 'none' && state.currentDrawTool !== 'select' && state.currentDrawTool !== 'drag') return;

    // Shift+click in drag mode: toggle multi-select
    if (state.isEditMode && state.currentDrawTool === 'drag' && event && event.shiftKey) {
        toggleMultiSelect('node', d.id);
        drawMultiSelectOutlines();
        return;
    }

    // In edit mode with link creation active
    if (state.isEditMode && state.currentDrawTool === 'none' && state.linkSourceNode) {
        completeLinkCreation(d.id);
        return;
    }

    // In edit mode, start link creation
    if (state.isEditMode && state.currentDrawTool === 'none' && !state.linkSourceNode) {
        startLinkCreation(d.id);
        return;
    }

    if (state.currentDrawTool === 'drag') {
        clearMultiSelect();
        return;
    }

    if (state.selectedNode === d.id) {
        clearSelection();
        closeSidePanel();
        return;
    }

    state.selectedNode = d.id;
    const connected = state.adjacency.get(d.id) || new Set();

    window.nodeElements
        .classed('dimmed', n => n.id !== d.id && !connected.has(n.id))
        .classed('highlighted', n => n.id === d.id);

    window.linkElements
        .classed('dimmed', l => l.source !== d.id && l.target !== d.id)
        .classed('highlighted', l => l.source === d.id || l.target === d.id);

    // Update arrow markers for highlight/dim states
    window.linkElements.each(function(l) {
        const el = d3.select(this);
        const isConnected = l.source === d.id || l.target === d.id;
        const suffix = isConnected ? 'highlighted' : 'dimmed';
        const mode = l.arrowMode || 'none';
        el.attr('marker-end', (mode === 'forward' || mode === 'both') ? `url(#arrow-forward-${suffix})` : null);
        el.attr('marker-start', (mode === 'reverse' || mode === 'both') ? `url(#arrow-reverse-${suffix})` : null);
    });

    showSidePanel(d);
}

const tooltip = d3.select('#tooltip');

function handleNodeHover(event, d) {

    tooltip.select('h4').text(d.name);

        .style('top', (event.pageY - 10) + 'px')

}

function handleNodeLeave() {
    tooltip.classed('visible', false);
}

function clearSelection() {
    state.selectedNode = null;
    if (window.nodeElements) {
        window.nodeElements.classed('dimmed', false).classed('highlighted', false);
        window.linkElements.classed('dimmed', false).classed('highlighted', false);
        // Reset arrow markers to normal
        applyLinkMarkers(window.linkElements);
    }
}

    panel.innerHTML = '';

    const hasLinks = state.navLinks.length > 0;

    panel.classList.toggle('hidden', !showPanel);

function drawAnnotations() {
    const layer = g.select('.annotation-layer');
    if (!layer.node()) return;

    const groups = layer.selectAll('.annotation')
        .data(state.annotations, d => d.id);

    groups.exit().remove();

    const enter = groups.enter().append('g')
        .attr('class', 'annotation');

    const merged = enter.merge(groups);
    merged.attr('class', d => 'annotation' + (state.currentDrawTool === 'select' ? ' selectable' : ''));

    merged.each(function(d) {
        const group = d3.select(this);
        group.selectAll('*').remove();

        // Add invisible hit target for easier selection of thin elements
        if (state.currentDrawTool === 'select') {
            switch(d.type) {
                case 'line':
                    group.append('line')
                        .attr('x1', d.x).attr('y1', d.y)
                        .attr('x2', d.x2).attr('y2', d.y2)
                        .attr('stroke', 'transparent')
                        .attr('stroke-width', 12);
                    break;
                case 'rect':
                    group.append('rect')
                        .attr('x', d.x).attr('y', d.y)
                        .attr('width', d.width).attr('height', d.height)
                        .attr('fill', 'none')
                        .attr('stroke', 'transparent')
                        .attr('stroke-width', 12);
                    break;
                case 'circle':
                    group.append('circle')
                        .attr('cx', d.x).attr('cy', d.y)
                        .attr('r', d.radius)
                        .attr('fill', 'none')
                        .attr('stroke', 'transparent')
                        .attr('stroke-width', 12);
                    break;
            }
        }

        const dashArray = d.dashed ? '8,4' : null;

        switch (d.type) {
            case 'line': {
                const el = group.append('line')
                    .attr('x1', d.x).attr('y1', d.y)
                    .attr('x2', d.x2).attr('y2', d.y2)
                    .attr('stroke', d.stroke)
                    .attr('stroke-width', d.strokeWidth)
                    .attr('opacity', d.opacity);
                if (dashArray) el.attr('stroke-dasharray', dashArray);
                break;
            }
            case 'rect': {
                const el = group.append('rect')
                    .attr('x', d.x).attr('y', d.y)
                    .attr('width', d.width).attr('height', d.height)
                    .attr('fill', 'none')
                    .attr('stroke', d.stroke)
                    .attr('stroke-width', d.strokeWidth)
                    .attr('opacity', d.opacity);
                if (dashArray) el.attr('stroke-dasharray', dashArray);
                break;
            }
            case 'circle': {
                const el = group.append('circle')
                    .attr('cx', d.x).attr('cy', d.y)
                    .attr('r', d.radius)
                    .attr('fill', 'none')
                    .attr('stroke', d.stroke)
                    .attr('stroke-width', d.strokeWidth)
                    .attr('opacity', d.opacity);
                if (dashArray) el.attr('stroke-dasharray', dashArray);
                break;
            }
            case 'text':
                group.append('text')
                    .attr('x', d.x).attr('y', d.y)
                    .attr('fill', d.stroke)
                    .attr('font-size', d.fontSize || 14)
                    .attr('opacity', d.opacity)
                    .text(d.text || '');
                break;
        }

        // Selection outline (only show resize handles for single annotation selection, not during multi-select)
        if (state.selectedAnnotation === d.id && state.multiSelected.size === 0) {
            const bbox = group.node().getBBox();
            group.append('rect')
                .attr('class', 'annotation-selection-outline')
                .attr('x', bbox.x - 3).attr('y', bbox.y - 3)
                .attr('width', bbox.width + 6).attr('height', bbox.height + 6)
                .attr('fill', 'none')
                .attr('stroke', '#f97316')
                .attr('stroke-width', 1)
                .attr('stroke-dasharray', '4,2')
                .attr('pointer-events', 'none');

            // Resize handles
            if (d.type === 'rect') {
                addResizeHandle(group, d, bbox.x, bbox.y, 'nw');
                addResizeHandle(group, d, bbox.x + bbox.width, bbox.y, 'ne');
                addResizeHandle(group, d, bbox.x, bbox.y + bbox.height, 'sw');
                addResizeHandle(group, d, bbox.x + bbox.width, bbox.y + bbox.height, 'se');
            } else if (d.type === 'circle') {
                addResizeHandle(group, d, d.x + d.radius, d.y, 'radius');
            } else if (d.type === 'line') {

                addResizeHandle(group, d, d.x2, d.y2, 'end');
            }
        }

        // Click to select in select mode (or shift-click for multi-select)
        group.on('click', function(event) {
            if (state.currentDrawTool === 'select' || state.currentDrawTool === 'drag') {
                event.stopPropagation();
                if (event.shiftKey) {
                    toggleMultiSelect('ann', d.id);
                    drawMultiSelectOutlines();
                } else if (state.currentDrawTool === 'select') {
                    selectAnnotation(d.id);
                }
            }
        });

        // Right-click context menu
        group.on('contextmenu', function(event) {
            if (state.isEditMode) {
                event.preventDefault();
                event.stopPropagation();
                selectAnnotation(d.id);
                openAnnotationContextMenu(event, d);
            }
        });

        // Drag to move in select/drag mode (with group move support)
        if (state.currentDrawTool === 'select' || state.currentDrawTool === 'drag') {
            const drag = d3.drag()
                .on('start', function(event) {
                    event.sourceEvent.stopPropagation();
                    // Group move: store start positions
                    if (isMultiSelected('ann', d.id) && state.multiSelected.size > 1) {
                        d._groupDrag = true;
                        d._startX = d.x; d._startY = d.y;
                        if (d.type === 'line') { d._startX2 = d.x2; d._startY2 = d.y2; }
                        getMultiSelectedNodes().forEach(nid => {
                            const n = state.nodeMap.get(nid);
                            if (n) { n._startX = n.x; n._startY = n.y; }
                        });
                        getMultiSelectedAnnotations().forEach(aid => {
                            const a = state.annotations.find(ann => ann.id === aid);
                            if (a && a.id !== d.id) { a._startX = a.x; a._startY = a.y; if (a.type === 'line') { a._startX2 = a.x2; a._startY2 = a.y2; } }
                        });
                        d._dragOriginX = d.x; d._dragOriginY = d.y;
                    } else {
                        d._groupDrag = false;
                    }
                })
                .on('drag', function(event) {
                    if (d._groupDrag) {
                        const dx = event.dx;
                        const dy = event.dy;
                        // Move all selected
                        getMultiSelectedAnnotations().forEach(aid => {
                            const a = state.annotations.find(ann => ann.id === aid);
                            if (a) { a.x += dx; a.y += dy; if (a.type === 'line') { a.x2 += dx; a.y2 += dy; } }
                        });
                        getMultiSelectedNodes().forEach(nid => {
                            const n = state.nodeMap.get(nid);
                            if (n) { n.x += dx; n.y += dy; }
                        });
                        g.selectAll('.node').attr('transform', n => `translate(${n.x - getNodeW(n)/2}, ${n.y})`);
                        clearAnchorCache();
                        if (window.linkElements) window.linkElements.attr('d', createBezierPath);
                        drawAnnotations();
                        drawMultiSelectOutlines();
                    } else {
                        if (state.selectedAnnotation !== d.id) return;
                        const dx = event.dx;
                        const dy = event.dy;
                        d.x += dx;
                        d.y += dy;
                        if (d.type === 'line') { d.x2 += dx; d.y2 += dy; }
                        drawAnnotations();
                    }
                })
                .on('end', function() {
                    if (d._groupDrag) {
                        state.nodes.forEach(n => { delete n._startX; delete n._startY; });
                        state.annotations.forEach(a => { delete a._startX; delete a._startY; delete a._startX2; delete a._startY2; });
                        clearAnchorCache();
                        if (window.linkElements) window.linkElements.attr('d', createBezierPath);
                        drawMultiSelectOutlines();
                    }
                    delete d._groupDrag; delete d._dragOriginX; delete d._dragOriginY;
                });
            group.call(drag);
        }
    });

    cursor: grabbing !important;
}

.node .node-shape {
    stroke-width: 2;
    transition: all 0.3s;
}

.node:hover .node-shape {
    filter: brightness(1.2);
}

.node text {
    font-size: 11px;
    fill: #f8fafc;
    text-anchor: middle;
    pointer-events: none;
    font-weight: 500;
}

body.light-mode .node text {
    fill: #1e293b;
}

.node .role-badge {
    font-size: 9px;
    fill: rgba(248, 250, 252, 0.7);
    font-weight: 400;
}

.link {
    fill: none;
    stroke-width: var(--link-width, 2);
    transition: opacity 0.3s, stroke-width 0.3s;
    pointer-events: none;
}

.link.dimmed {
    opacity: 0.1;
}

.link.highlighted {
    stroke-width: var(--link-width-highlight, 3);
    opacity: 1;
}

.link.clickable {
    pointer-events: stroke;
    cursor: pointer;
}

.link.clickable:hover {
    stroke-width: var(--link-width-hover, 4);
    opacity: 0.8;
}

.annotation.selectable {
    cursor: pointer;
}

.annotation.selectable:hover {
    filter: brightness(1.3);
}

.link.selected-link {
    stroke: #f97316;
    stroke-width: var(--link-width-highlight, 3);
    opacity: 1;
}

.node.dimmed {
    opacity: 0.15;
}

.node.role-filtered {
    opacity: 0.2;
}

.node.highlighted .node-shape {
    stroke-width: 3;
    filter: drop-shadow(0 0 8px currentColor);
}

.node.link-source .node-shape {
    stroke-width: 4;
    stroke: #f97316 !important;
    filter: drop-shadow(0 0 12px #f97316);
}

#tooltip {
    position: fixed;
    background: rgba(15, 23, 42, 0.98);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 8px;
    padding: 12px 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, background 0.3s ease, border-color 0.3s ease;
    z-index: 200;
    max-width: 320px;
    backdrop-filter: blur(8px);
}

body.light-mode #tooltip {
    background: rgba(217, 201, 176, 0.98);
    border: 1px solid rgba(30, 41, 59, 0.2);
}

#tooltip.visible {
    opacity: 1;
}

#tooltip h4 {
    font-size: 0.875rem;
    color: #f1f5f9;
    margin-bottom: 6px;
}

body.light-mode #tooltip h4 {
    color: #1e293b;
}

#tooltip p {
    font-size: 0.75rem;
    color: #94a3b8;
    line-height: 1.4;
    white-space: pre-wrap;
}

body.light-mode #tooltip p {
    color: #64748b;
}

#tooltip .role {
    display: inline-block;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    margin-top: 8px;
    color: white;
}

.instructions {
    position: fixed;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    color: #64748b;
    font-size: 0.6rem;
    text-align: center;
    max-width: 600px;
    line-height: 1.3;
}

/* Nav links panel */
#nav-links-panel {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 100;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 6px;
    padding: 6px 8px;
    backdrop-filter: blur(8px);
    transition: background 0.3s ease, border-color 0.3s ease;
}

body.light-mode #nav-links-panel {
    background: rgba(217, 201, 176, 0.9);
    border: 1px solid rgba(30, 41, 59, 0.15);
}

#nav-links-panel.hidden {
    display: none;
}

#nav-links-panel .nav-link-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #334155;
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #e2e8f0;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.65rem;
    transition: all 0.2s;
    text-decoration: none;
    white-space: nowrap;
}

body.light-mode #nav-links-panel .nav-link-btn {
    background: #e8e4de;
    border: 1px solid rgba(30, 41, 59, 0.2);
    color: #1e293b;
}

#nav-links-panel .nav-link-btn:hover {
    background: #475569;
    border-color: rgba(148, 163, 184, 0.3);
}

body.light-mode #nav-links-panel .nav-link-btn:hover {
    background: #d4d0c8;
    border-color: rgba(30, 41, 59, 0.3);
}

/* Temporary link line */
.temp-link {
    stroke: #f97316;
    stroke-width: 3;
    stroke-dasharray: 8,4;
    fill: none;
    pointer-events: none;
}

#version-label {
    position: fixed;
    bottom: 6px;
    right: 10px;
    font-size: 10px;
    opacity: 0.4;
    color: #1e293b;
    pointer-events: none;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body.dark-mode #version-label {
    color: #e2e8f0;
}</style>
